AutoName: claudeAssist
Summary: WebView-Wrapper für claude.ai
Description: |-
    claudeAssist ist ein schlanker WebView-Wrapper für die claude.ai Chat-Weboberfläche.
    Es blockiert Tracking- und Analytics-Domains, die für die Kernfunktion nicht
    notwendig sind, und lässt Login/Chat-Funktionen ansonsten unangetastet.

    Kein eigenes Tracking, keine Werbung. Für den Login und die Nutzung von claude.ai
    selbst gelten die Bedingungen von Anthropic.

